# Runs with prek (https://github.com/j178/prek), a drop-in pre-commit runner.
#   prek install         # wire up the git hook
#   prek run --all-files # run every hook against the whole tree
#
# See https://pre-commit.com for the config format and https://pre-commit.com/hooks.html for more hooks.

# Vendored third-party assets — never rewrite them.
exclude: '^examples/research_paper_assets/LaTeXTemplates_journal-article_v2\.0/'

repos:
  - repo: 'https://github.com/astral-sh/ruff-pre-commit'
    # Pinned to the same ruff the dev group pins in pyproject.toml, so local
    # hooks and CI lint against one ruleset.
    rev: v0.15.17
    hooks:
      # Lint with autofix, then format — the linter runs first so its fixes
      # don't fight the formatter's output.
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: 'https://github.com/pre-commit/pre-commit-hooks'
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  # Secret scanning across the whole tree.
  - repo: 'https://github.com/gitleaks/gitleaks'
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Markdown lint + format (Quarto flavor — see .rumdl.toml).
  - repo: 'https://github.com/rvben/rumdl-pre-commit'
    rev: v0.2.16
    hooks:
      - id: rumdl
      - id: rumdl-fmt

  # Conventional Commits enforcement on the commit message.
  - repo: 'https://github.com/alessandrojcm/commitlint-pre-commit-hook'
    rev: v9.25.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']

  - repo: local
    hooks:
      # Enforce the layered architecture on any change under src/. The layer
      # contract is defined in [tool.importlinter] in pyproject.toml.
      - id: import-linter
        name: import-linter (layered architecture)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        files: ^src/autosprint/.*\.py$
      - id: ty
        name: ty (type check)
        entry: uv run ty check src
        language: system
        pass_filenames: false
        files: ^src/autosprint/.*\.py$
